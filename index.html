  <script src="/_sdk/b67df6528afa6d57.editing_sdk.js" integrity="sha512-ObK/O8PVNdvePOE833JpZI0oKCuD4dnU+D+5PMwY4U3o0z4/Q4l01EB77zMvgnmBiBHpDMCJTfVYFVrzp7r1lw=="></script>
  <script>
(function(){
    // State
    let currentColor = '#e88fb4';
    let currentTool = 'pen';
    let favorites = ['#e88fb4','#f9d56e','#88d8b0','#7ec8e3','#c3aed6','#ff6b6b','#ffa07a','#98d8c8'];
    let undoStack = [];
    let redoStack = [];
    let zoom = 1, panX = 0, panY = 0;
    let toolbarVisible = true;

    const STORAGE_KEY = 'coloringbook_v1';
    const svgContainer = document.getElementById('svg-container');
    const svgWrapper = document.getElementById('svg-wrapper');
    const svg = document.getElementById('coloring-svg');

    // Save/Load
    function save() {
        const fills = {};
        svg.querySelectorAll('path,polygon,circle,ellipse,rect:not([data-bg])').forEach((el, i) => {
            fills[i] = el.getAttribute('fill');
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ fills, favorites, currentColor, currentTool, zoom, panX, panY }));
    }

    function load() {
        try {
            const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (!d) return;
            if (d.fills) {
                svg.querySelectorAll('path,polygon,circle,ellipse,rect:not([data-bg])').forEach((el, i) => {
                    if (d.fills[i]) el.setAttribute('fill', d.fills[i]);
                });
            }
            if (d.favorites) favorites = d.favorites;
            if (d.currentColor) currentColor = d.currentColor;
            if (d.currentTool) currentTool = d.currentTool;
            if (d.zoom) zoom = d.zoom;
            if (d.panX !== undefined) panX = d.panX;
            if (d.panY !== undefined) panY = d.panY;
            applyTransform();
        } catch(e) {}
    }

    function applyTransform() {
        svgWrapper.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    }

    // Undo/Redo
    function pushUndo(el, oldFill) {
        undoStack.push({ el, oldFill, newFill: el.getAttribute('fill') });
        redoStack = [];
        if (undoStack.length > 100) undoStack.shift();
    }

    document.getElementById('undo-btn').onclick = () => {
        const a = undoStack.pop();
        if (!a) return;
        a.el.setAttribute('fill', a.oldFill);
        redoStack.push(a);
        save();
    };
    document.getElementById('redo-btn').onclick = () => {
        const a = redoStack.pop();
        if (!a) return;
        a.el.setAttribute('fill', a.newFill);
        undoStack.push(a);
        save();
    };

    // SVG coloring
    svg.addEventListener('click', (e) => {
        const el = e.target;
        if (el.hasAttribute('data-bg') || el === svg) return;
        if (!el.matches('path,polygon,circle,ellipse,rect')) return;

        if (currentTool === 'eyedropper') {
            currentColor = el.getAttribute('fill') || '#ffffff';
            updateCurrentColor();
            save();
            return;
        }

        const oldFill = el.getAttribute('fill');
        const newFill = currentTool === 'eraser' ? '#ffffff' : currentColor;
        if (oldFill === newFill) return;
        el.setAttribute('fill', newFill);
        pushUndo(el, oldFill);
        save();
    });

    // Tools
    document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTool = btn.dataset.tool;
            save();
        };
    });

    // Favorites
    function renderFavorites() {
        const row = document.getElementById('favorites-row');
        row.innerHTML = '';
        favorites.forEach((c, i) => {
            const d = document.createElement('div');
            d.className = 'color-dot flex-shrink-0' + (c === currentColor ? ' active' : '');
            d.style.background = c;
            d.onclick = () => { currentColor = c; updateCurrentColor(); save(); };
            d.ondblclick = () => { favorites[i] = currentColor; renderFavorites(); save(); };
            row.appendChild(d);
        });
    }

    function updateCurrentColor() {
        document.getElementById('current-color').style.background = currentColor;
        renderFavorites();
    }

    // Color picker
    document.getElementById('color-picker-btn').onclick = () => {
        document.getElementById('native-picker').value = currentColor;
        document.getElementById('color-picker-modal').style.display = 'flex';
    };
    document.getElementById('picker-ok').onclick = () => {
        currentColor = document.getElementById('native-picker').value;
        updateCurrentColor(); save();
        document.getElementById('color-picker-modal').style.display = 'none';
    };
    document.getElementById('picker-cancel').onclick = () => {
        document.getElementById('color-picker-modal').style.display = 'none';
    };

    // Clear
    document.getElementById('clear-btn').onclick = () => {
        document.getElementById('confirm-modal').style.display = 'flex';
    };
    document.getElementById('confirm-yes').onclick = () => {
        svg.querySelectorAll('path,polygon,circle,ellipse,rect:not([data-bg])').forEach(el => el.setAttribute('fill', '#ffffff'));
        undoStack = []; redoStack = [];
        document.getElementById('confirm-modal').style.display = 'none';
        save();
    };
    document.getElementById('confirm-no').onclick = () => {
        document.getElementById('confirm-modal').style.display = 'none';
    };

    // Zoom & Pan (pinch + double tap)
    let touches = [], lastDist = 0, lastPanX = 0, lastPanY = 0, isPanning = false;

    svgContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            isPanning = false;
        } else if (e.touches.length === 1 && zoom > 1) {
            lastPanX = e.touches[0].clientX - panX;
            lastPanY = e.touches[0].clientY - panY;
            isPanning = true;
        }
    }, { passive: false });

    svgContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            zoom = Math.min(5, Math.max(1, zoom * (dist / lastDist)));
            lastDist = dist;
            applyTransform(); save();
        } else if (e.touches.length === 1 && isPanning && zoom > 1) {
            e.preventDefault();
            panX = e.touches[0].clientX - lastPanX;
            panY = e.touches[0].clientY - lastPanY;
            applyTransform(); save();
        }
    }, { passive: false });

    // Double tap reset
    let lastTap = 0;
    svgContainer.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300 && e.changedTouches.length === 1) {
            zoom = 1; panX = 0; panY = 0;
            applyTransform(); save();
        }
        lastTap = now;
        isPanning = false;
    });

    document.getElementById('zoom-reset-btn').onclick = () => {
        zoom = 1; panX = 0; panY = 0; applyTransform(); save();
    };

    // Toggle toolbar
    document.getElementById('toggle-toolbar-btn').onclick = () => {
        const tb = document.getElementById('toolbar');
        toolbarVisible = !toolbarVisible;
        tb.classList.toggle('toolbar-exit', !toolbarVisible);
        tb.classList.toggle('toolbar-enter', toolbarVisible);
    };

    // Init
    load();
    renderFavorites();
    updateCurrentColor();
    document.querySelectorAll('[data-tool]').forEach(b => { if (b.dataset.tool === currentTool) { b.classList.add('active'); } else { b.classList.remove('active'); } });
    lucide.createIcons();
})();
</script>
